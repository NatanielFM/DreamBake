<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar sesión — Dulce Sueños</title>
  <meta name="description" content="Iniciá sesión para gestionar pedidos y ver tu historial." />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>

  <!-- Header por script-->
  <div id="header"></div>

  <!-- Main -->
  <main id="main" style="padding-top: var(--header-height);"> 

    <section class="login-hero" aria-labelledby="login-title">

      <div class="login-inner single-column">
        
        <div class="login-card" role="region" aria-labelledby="login-title">
          <h1 id="login-title" class="login-title">Iniciar sesión</h1>

          <div id="login-status" class="login-status" role="status" aria-live="polite"></div>

          <form id="login-form" class="form" action="/api/auth/login" method="post" novalidate>
            <label for="email" class="form-label">Correo electrónico</label>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
                   class="form-input" placeholder="tu@ejemplo.com" required>

            <label for="password" class="form-label">Contraseña</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password"
                     class="form-input" placeholder="Contraseña" required>
              <button type="button" class="btn-toggle-pass" id="toggle-password" aria-label="Mostrar contraseña">👁️</button>
            </div>

            <div class="form-row">
              <label class="checkbox">
                <input type="checkbox" name="remember" id="remember">
                <span>Recordarme</span>
              </label>

              <a class="link-muted" href="/forgot-password.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary login-submit" id="login-submit">
              <span class="btn-text">Entrar</span>
              <span class="btn-spinner visually-hidden" id="login-spinner" aria-hidden="true">⏳</span>
            </button>
          </form>

          <!-- Social login -->
          <div class="social-login" aria-label="Iniciar sesión con redes">
            <!-- Google -->
            <button class="btn btn-social btn-google" id="social-google" aria-label="Continuar con Google">
                <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#607d8b"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
                >
                <path d="M20.945 11a9 9 0 1 1 -3.284 -5.997l-2.655 2.392a5.5 5.5 0 1 0 2.119 6.605h-4.125v-3h7.945z" />
                </svg>
            </button>

            <!-- Facebook -->
            <button class="btn btn-social btn-facebook" id="social-facebook" aria-label="Continuar con Facebook">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="32"
                    height="32"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#607d8b"
                    stroke-width="1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    >
                    <path d="M7 10v4h3v7h4v-7h3l1 -4h-4v-2a1 1 0 0 1 1 -1h3v-4h-3a5 5 0 0 0 -5 5v2h-3" />
                </svg>
            </button>
          </div>

          <p class="signup-note">¿No tenés cuenta? <a href="/register.html">Registrate</a></p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
    <footer>
        © <strong>Dulce Sueños Posadas</strong>
    </footer>
  <!-- Scripts -->
   <script src="scripts/header.js" defer></script>
   <script src="scripts/login.js" defer></script>  

</body>
</html>
