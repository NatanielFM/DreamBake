<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar sesión — Dulce Sueños</title>
  <meta name="description" content="Iniciá sesión para gestionar pedidos y ver tu historial." />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/header.css">
  <link rel="stylesheet" href="styles/footer.css">
  <link rel="stylesheet" href="styles/login.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Dulce Sueños Posadas">
        <svg class="brand-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10" fill="#e0487f"/>
          <path d="M7 12c1.5-2 4-2 5 0 1-2 3.5-2 5 0" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="brand-text">Dulce Sueños</span>
      </a>

      <nav class="main-nav" role="navigation" aria-label="Navegación principal">
        <ul class="nav-list">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="products.html">Productos</a></li>
          <li><a href="about.html">Nosotros</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a class="btn-social btn-whatsapp" href="https://wa.me/549XXXXXXXXXX" target="_blank" rel="noopener" aria-label="Contactar por WhatsApp">
          <img src="media/icons/whatsapp.png" alt="WhatsApp" width="20" height="20" loading="lazy">
        </a>

        <a class="btn-social btn-ig" href="https://www.instagram.com/dulcessuenos_posadas/" target="_blank" rel="noopener" aria-label="Instagram">
          <img src="media/icons/instagram.png" alt="Instagram" width="20" height="20" loading="lazy">
        </a>

        <!-- Botón carrito -->
        <button class="btn-social btn-cart" id="cart-button" aria-label="Ver carrito. 0 artículos" aria-haspopup="true" aria-expanded="false">
          <!-- Icono carrito (SVG) -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="currentColor"
          >
            <path d="M6 2a1 1 0 0 1 .993 .883l.007 .117v1.068l13.071 .935a1 1 0 0 1 .929 1.024l-.01 .114l-1 7a1 1 0 0 1 -.877 .853l-.113 .006h-12v2h10a3 3 0 1 1 -2.995 3.176l-.005 -.176l.005 -.176c.017 -.288 .074 -.564 .166 -.824h-5.342a3 3 0 1 1 -5.824 1.176l-.005 -.176l.005 -.176a3.002 3.002 0 0 1 1.995 -2.654v-12.17h-1a1 1 0 0 1 -.993 -.883l-.007 -.117a1 1 0 0 1 .883 -.993l.117 -.007h2zm0 16a1 1 0 1 0 0 2a1 1 0 0 0 0 -2zm11 0a1 1 0 1 0 0 2a1 1 0 0 0 0 -2z" />
          </svg>
          <span class="cart-count" id="cart-count" aria-hidden="true">0</span>
        </button>

        <button class="btn-social btn-login" id="login-button" aria-controls="login-modal" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5z"></path></svg>
        </button>

        <button id="menuButton" class="menu-button" aria-expanded="false" aria-controls="mobileMenu" aria-label="Abrir menú">Menú</button>
      </div>
    </div>

    <div id="mobileMenu" class="mobile-menu" hidden>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="products.html">Productos</a></li>
        <li><a href="about.html">Nosotros</a></li>
        <li><a href="contact.html">Contacto</a></li>
      </ul>
    </div>
  </header>

  <!-- Main -->
  <main id="main" style="padding-top: var(--header-height);"> 

    <section class="login-hero" aria-labelledby="login-title">

      <div class="login-inner single-column">
        
        <div class="login-card" role="region" aria-labelledby="login-title">
          <h1 id="login-title" class="login-title">Iniciar sesión</h1>

          <div id="login-status" class="login-status" role="status" aria-live="polite"></div>

          <form id="login-form" class="form" action="/api/auth/login" method="post" novalidate>
            <label for="email" class="form-label">Correo electrónico</label>
            <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
                   class="form-input" placeholder="tu@ejemplo.com" required>

            <label for="password" class="form-label">Contraseña</label>
            <div class="password-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password"
                     class="form-input" placeholder="Contraseña" required>
              <button type="button" class="btn-toggle-pass" id="toggle-password" aria-label="Mostrar contraseña">👁️</button>
            </div>

            <div class="form-row">
              <label class="checkbox">
                <input type="checkbox" name="remember" id="remember">
                <span>Recordarme</span>
              </label>

              <a class="link-muted" href="/forgot-password.html">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn btn-primary login-submit" id="login-submit">
              <span class="btn-text">Entrar</span>
              <span class="btn-spinner visually-hidden" id="login-spinner" aria-hidden="true">⏳</span>
            </button>
          </form>

          <!-- Social login -->
          <div class="social-login" aria-label="Iniciar sesión con redes">
            <!-- Google -->
            <button class="btn btn-social btn-google" id="social-google" aria-label="Continuar con Google">
                <svg
                xmlns="http://www.w3.org/2000/svg"
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#607d8b"
                stroke-width="1"
                stroke-linecap="round"
                stroke-linejoin="round"
                >
                <path d="M20.945 11a9 9 0 1 1 -3.284 -5.997l-2.655 2.392a5.5 5.5 0 1 0 2.119 6.605h-4.125v-3h7.945z" />
                </svg>
            </button>

            <!-- Facebook -->
            <button class="btn btn-social btn-facebook" id="social-facebook" aria-label="Continuar con Facebook">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="32"
                    height="32"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="#607d8b"
                    stroke-width="1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    >
                    <path d="M7 10v4h3v7h4v-7h3l1 -4h-4v-2a1 1 0 0 1 1 -1h3v-4h-3a5 5 0 0 0 -5 5v2h-3" />
                </svg>
            </button>
          </div>

          <p class="signup-note">¿No tenés cuenta? <a href="/register.html">Registrate</a></p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
    <footer>
        © <strong>Dulce Sueños Posadas</strong>
    </footer>
  <!-- Scripts -->
   <script src="scripts/header.js" defer></script>
   <script src="scripts/login.js" defer></script>  

</body>
</html>
