<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Administración — Dulce Sueños</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">

  <link rel="stylesheet" href="styles/admin.css">
</head>
<body>

  <!-- Header específico de administración -->
  <header class="site-header admin-header" role="banner">
    <div class="header-inner">
      <div class="admin-left">Administración</div>
      <div class="admin-center">
        <a href="index.html" class="btn btn-primary">Volver a la web</a>
      </div>
      <div class="admin-right">Hola, Nataniel</div>
    </div>
  </header>

  <!-- Layout principal -->
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <nav>
        <button class="tab-btn active" data-tab="resumen">Resumen</button>
        <button class="tab-btn" data-tab="pedidos">Pedidos</button>
        <button class="tab-btn" data-tab="inventario">Inventario</button>
        <button class="tab-btn" data-tab="clientes">Clientes</button>
        <!-- Logout al fondo -->
        <div class="sidebar-bottom">
        <button id="logout-button" class="logout-btn" aria-label="Cerrar sesión">Cerrar sesión</button>
        </div>
      </nav>
    </aside>

    <!-- Contenido -->
    <main class="dashboard">
      <section id="resumen" class="tab-content active">
        <h2>Resumen</h2>
        <p>Aquí se mostrarán métricas generales del negocio.</p>
      </section>

      <section id="pedidos" class="tab-content">
        <h2>Pedidos</h2>
        <p>Listado y estado de pedidos.</p>
      </section>

      <section id="inventario" class="tab-content">
        <h2>Inventario</h2>
        <p>Gestión de stock y materias primas.</p>
      </section>

      <section id="clientes" class="tab-content">
        <h2>Clientes</h2>
        <p>Información de clientes registrados.</p>
      </section>
    </main>
  </div>

  <script src="scripts/admin.js" defer></script>
</body>
</html>
