<!doctype html>
<!--/*
  Diseño común de las páginas de error propias (paso 6.3). Spring Boot muestra error/404.html, error/403.html,
  error/500.html según el código y error.html (carpeta de arriba) para el resto.
  Es una página independiente (sin header ni footer): cuando algo falla puede no haber datos para armarlos.
  NUNCA muestra detalles técnicos: no usa ${trace}, ${exception} ni ${message}, solo textos fijos.
  Uso: <html th:replace="~{error/layout :: page('404', 'Título', 'Mensaje')}">
*/-->
<html lang="es-AR" xmlns:th="http://www.thymeleaf.org" th:fragment="page(code, title, text)">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#fef9f9" />
  <meta name="robots" content="noindex" />
  <th:block th:replace="~{fragments/seo :: icons}"></th:block>
  <title th:text="${title} + ' — Dulce Sueños Posadas'">Error — Dulce Sueños Posadas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/components.css}">
  <link rel="stylesheet" th:href="@{/css/error.css}">
</head>
<body class="page-error">
  <main class="error-card">
    <a class="error-logo" th:href="@{/}" aria-label="Dulce Sueños Posadas, ir al inicio">
      <img th:src="@{/img/favicon.svg}" alt="" width="56" height="56">
      <span>Dulce Sueños</span>
    </a>
    <p class="error-code" th:text="${code}">404</p>
    <h1 class="error-title" th:text="${title}">No encontramos esta página</h1>
    <p class="error-text" th:text="${text}">Mensaje.</p>
    <div class="error-actions">
      <a class="button button--primary button--lg" th:href="@{/}">Volver al inicio</a>
      <a class="button button--secondary button--lg" th:href="@{/products}">Ver productos</a>
    </div>
  </main>
</body>
</html>
