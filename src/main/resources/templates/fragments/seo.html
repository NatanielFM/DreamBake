<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es-AR">
<body>
  <!--/*
    Etiquetas del <head> compartidas (paso 6.3).

    1) icons: ícono de la pestaña en todos los tamaños (lo usan TODAS las páginas, también los paneles).
       <th:block th:replace="~{fragments/seo :: icons}"></th:block>

    2) share(title, description, path): descripción para Google y la vista previa al compartir el link
       por WhatsApp, Facebook o Instagram (Open Graph). title = el mismo texto del <title> de la página.
       siteUrl = app.public-url (PublicViewAdvice). Cada página tiene su propia descripción.
       <th:block th:replace="~{fragments/seo :: share('Productos — Dulce Sueños Posadas', 'Descripción…', '/products')}"></th:block>
  */-->

  <th:block th:fragment="icons">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}" />
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/icons/favicon-32x32.png}" />
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/icons/favicon-16x16.png}" />
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/icons/apple-touch-icon.png}" />
    <link rel="manifest" th:href="@{/site.webmanifest}" />
  </th:block>

  <th:block th:fragment="share(title, description, path)">
    <meta name="description" th:content="${description}">
    <link rel="canonical" th:href="${siteUrl} + ${path}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dulce Sueños Posadas">
    <meta property="og:locale" content="es_AR">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:content="${siteUrl} + ${path}">
    <!-- Imagen de 1200×630 con el logo y el nombre (img/og-marca.jpg, ~95 KB: WhatsApp necesita que sea liviana) -->
    <meta property="og:image" th:content="${siteUrl} + '/img/og-marca.jpg'">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Dulce Sueños Posadas: tortas personalizadas y mesas dulces">
    <meta name="twitter:card" content="summary_large_image">
  </th:block>
</body>
</html>
