<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<body>
  <header th:fragment="header" class="site-header">
    <div class="header-inner">
      <button id="menuButton" class="menu-button" aria-expanded="false" aria-label="Abrir menú" type="button">
        <svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true" focusable="false">
          <rect y="0" width="22" height="2" rx="1" fill="currentColor"></rect>
          <rect y="7" width="22" height="2" rx="1" fill="currentColor"></rect>
          <rect y="14" width="22" height="2" rx="1" fill="currentColor"></rect>
        </svg>
      </button>

      <a class="brand" th:href="@{/}">
        <svg class="brand-icon" width="36" height="36" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10" fill="#e0487f"/>
          <path d="M7 12c1.5-2 4-2 5 0 1-2 3.5-2 5 0" stroke="#fff" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="brand-text">Dulce Sueños</span>
      </a>

      <nav class="main-nav">
        <ul class="nav-list">
          <li><a th:href="@{/}">Inicio</a></li>
          <li><a th:href="@{/products}">Productos</a></li>
          <li><a th:href="@{/about}">Nosotros</a></li>
          <li><a th:href="@{/contact}">Contacto</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a class="btn-icon btn-whatsapp" href="https://wa.me/549XXXXXXXXXX" target="_blank" rel="noopener" aria-label="WhatsApp">
          <img th:src="@{/img/icons/whatsapp.png}" alt="WA" width="20" height="20" loading="lazy">
        </a>
        <a class="btn-icon btn-ig" href="https://www.instagram.com/dulcessuenos_posadas/" target="_blank" rel="noopener" aria-label="Instagram">
          <img th:src="@{/img/icons/instagram.png}" alt="IG" width="20" height="20" loading="lazy">
        </a>
        
        <a th:href="@{/cart}" class="btn-icon btn-cart" aria-label="Ver carrito">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 2a1 1 0 0 1 .993 .883l.007 .117v1.068l13.071 .935a1 1 0 0 1 .929 1.024l-.01 .114l-1 7a1 1 0 0 1 -.877 .853l-.113 .006h-12v2h10a3 3 0 1 1 -2.995 3.176l-.005 -.176l.005 -.176c.017 -.288 .074 -.564 .166 -.824h-5.342a3 3 0 1 1 -5.824 1.176l-.005 -.176l.005 -.176a3.002 3.002 0 0 1 1.995 -2.654v-12.17h-1a1 1 0 0 1 -.993 -.883l-.007 -.117a1 1 0 0 1 .883 -.993l.117 -.007h2zm0 16a1 1 0 1 0 0 2a1 1 0 0 0 0 -2zm11 0a1 1 0 1 0 0 2a1 1 0 0 0 0 -2z" />
          </svg>
          <span class="cart-count header-cart-count">0</span>
        </a>

        <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn-icon btn-login" aria-label="Iniciar sesión">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5z"></path></svg>
        </a>

        <div sec:authorize="isAuthenticated()" class="user-wrapper">
          <button id="accountBtn" class="btn-icon btn-login" aria-label="Mi cuenta" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4.418 0-8 2.239-8 5v1h16v-1c0-2.761-3.582-5-8-5z"></path></svg>
          </button>

          <div id="userMenu" class="user-menu" hidden>
            <div class="user-menu-title">
                Hola, <span th:if="${currentUser != null}" th:text="${currentUser.name.split(' ')[0]}">Usuario</span>
            </div>
            <hr>
            <a th:href="@{/profile}" class="user-menu-item">
                <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>Ajustes</span>
            </a>
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="user-menu-item logout-btn">
                <svg class="icon" width="18" height="18" viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-8v2h8v14h-8v2h8a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"></path></svg>
                <span>Cerrar sesión</span>
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="mobileMenu" class="mobile-menu" hidden>
      <ul>
        <li><a th:href="@{/}">Inicio</a></li>
        <li><a th:href="@{/products}">Productos</a></li>
        <li><a th:href="@{/about}">Nosotros</a></li>
        <li><a th:href="@{/contact}">Contacto</a></li>
      </ul>
    </div>
  </header>
</body>
</html>
