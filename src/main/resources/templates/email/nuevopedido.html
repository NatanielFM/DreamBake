<!DOCTYPE html>
<!--/*
  Aviso al NEGOCIO de que entró un pedido nuevo desde la tienda (OrderNoticeService, tipo NEW_ORDER_ALERT).
  Variables: p (datos del pedido), panelUrl (link al panel de administración).
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout(~{::#cuerpo})}">
<body>
  <div id="cuerpo">
    <h1 style="margin:0 0 12px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:26px;line-height:34px;font-weight:600;color:#481729;"
        th:text="'Nuevo pedido #' + ${p.id}">Nuevo pedido #12</h1>
    <p style="margin:0 0 16px 0;">
      <strong th:text="${p.customerName}">Ana Pérez</strong> hizo un pedido en la tienda y está esperando confirmación.
    </p>

    <p style="margin:0 0 16px 0;font-size:14px;line-height:22px;">
      Teléfono:
      <a th:href="'https://wa.me/' + ${p.phone.replaceAll('[^0-9]', '')}" href="#" style="color:#9d3259;text-decoration:underline;" th:text="${p.phone}">3764 123456</a><br>
      <span th:if="${!#strings.isEmpty(p.email)}">Email: <span th:text="${p.email}">ana@gmail.com</span></span>
      <span th:if="${#strings.isEmpty(p.email)}" style="color:#666666;">No dejó email.</span>
    </p>

    <div th:replace="~{email/pedido-detalle :: detalle(${p})}"></div>

    <!--/* Botón: se arma con una tabla porque Outlook y Gmail no respetan el padding de un link común */-->
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 8px 0;">
      <tr>
        <td align="center" bgcolor="#be3d6c" style="border-radius:999px;background-color:#be3d6c;">
          <a th:href="${panelUrl}" href="#"
             style="display:inline-block;padding:13px 28px;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:999px;">
            Ver el pedido en el panel
          </a>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
