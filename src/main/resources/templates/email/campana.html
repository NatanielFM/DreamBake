<!DOCTYPE html>
<!--/*
  Email de una campaña de promociones (CampaignService / CampaignSender).
  Variables (todas TEXTO escrito por el administrador; se muestran con th:text, que las escapa:
  un "<script>" se ve como texto y no se ejecuta):
    titulo, parrafos (lista de párrafos, cada uno con sus renglones), imagenSrc (cid:imagen o /uploads/...),
    botonTexto + botonUrl, cuponCodigo + cuponBeneficio + cuponVence.
  Usa el diseño común de base.html; el link de baja del pie lo agrega EmailService.
*/-->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/base :: layout(~{::#cuerpo})}">
<body>
  <div id="cuerpo">
    <h1 th:if="${!#strings.isEmpty(titulo)}" th:text="${titulo}"
        style="margin:0 0 16px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:26px;line-height:34px;font-weight:600;color:#481729;">
      Título de la campaña
    </h1>

    <!--/* Foto de la galería (opcional). En el email real va dentro del mensaje (cid:imagen) */-->
    <img th:if="${imagenSrc != null}" th:src="${imagenSrc}" alt="" width="536"
         style="display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px;margin:0 0 20px 0;">

    <!--/* Texto: cada párrafo con sus renglones (el <br> lo pone la plantilla, no el administrador) */-->
    <p th:each="parrafo : ${parrafos}" style="margin:0 0 16px 0;">
      <th:block th:each="renglon, estado : ${parrafo}"><span th:text="${renglon}">Texto</span><br th:unless="${estado.last}"></th:block>
    </p>

    <!--/* Cupón (opcional): el mismo recuadro que el email de cumpleaños */-->
    <table th:if="${cuponCodigo != null}" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 20px 0;">
      <tr>
        <td align="center" bgcolor="#fdf4f7" style="background-color:#fdf4f7;border:2px dashed #e0487f;border-radius:14px;padding:20px 12px;">
          <p style="margin:0 0 6px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:18px;color:#666666;"
             th:text="${cuponBeneficio}">10% de descuento</p>
          <p style="margin:0;font-family:'Courier New',Courier,monospace;font-size:28px;line-height:36px;font-weight:700;letter-spacing:3px;color:#481729;"
             th:text="${cuponCodigo}">DULCE10</p>
          <p style="margin:8px 0 0 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:18px;color:#666666;">
            Ingresalo en el carrito, en "¿Tenés un cupón?"<th:block th:if="${cuponVence != null}"> · válido hasta el <strong th:text="${cuponVence}">30/11/2026</strong></th:block>
          </p>
        </td>
      </tr>
    </table>

    <!--/* Botón (opcional): se arma con una tabla porque Outlook y Gmail no respetan el padding de un link común */-->
    <table th:if="${botonTexto != null}" role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 8px 0;">
      <tr>
        <td align="center" bgcolor="#be3d6c" style="border-radius:999px;background-color:#be3d6c;">
          <a th:href="${botonUrl}" href="#" th:text="${botonTexto}"
             style="display:inline-block;padding:13px 28px;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;line-height:20px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:999px;">
            Ver promos
          </a>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
