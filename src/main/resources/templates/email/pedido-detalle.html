<!DOCTYPE html>
<!--/*
  Bloque común con el detalle de un pedido (entrega, productos y montos). Lo usan los emails de pedidos:
    <div th:replace="~{email/pedido-detalle :: detalle(${p})}"></div>
  "p" es un OrderNoticeService.OrderView (texto ya listo). Todo se muestra con th:text, que lo escapa.
*/-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <table th:fragment="detalle(p)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="margin:0 0 20px 0;border:1px solid #f7d1df;border-radius:12px;background-color:#fdf4f7;">
    <tr>
      <td style="padding:16px 18px;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:22px;color:#222222;">
        <p style="margin:0 0 10px 0;font-weight:600;color:#481729;" th:text="'Pedido #' + ${p.id}">Pedido #12</p>

        <p style="margin:0 0 2px 0;color:#666666;font-size:12px;line-height:18px;">Entrega</p>
        <p style="margin:0 0 10px 0;">
          <strong th:text="${p.deliveryDay}">Viernes 10 de octubre</strong><span th:if="${!#strings.isEmpty(p.shift)}" th:text="' · ' + ${p.shift}"> · Por la tarde</span><br>
          <span th:text="${p.method}">Retiro en el local</span><span th:if="${!#strings.isEmpty(p.address)}" th:text="': ' + ${p.address}">: Calle 123</span>
        </p>

        <p style="margin:0 0 4px 0;color:#666666;font-size:12px;line-height:18px;">Productos</p>
        <div th:each="it : ${p.items}" style="margin:0 0 8px 0;">
          <strong th:text="${it.name}">Torta Personalizada</strong>
          <div th:each="line : ${it.lines}" style="color:#444444;font-size:13px;line-height:19px;" th:text="${line}">20 porciones</div>
        </div>

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:12px;border-top:1px solid #f7d1df;">
          <tr>
            <td style="padding:10px 0 2px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;color:#222222;">Total</td>
            <td align="right" style="padding:10px 0 2px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;color:#481729;" th:text="'$' + ${p.total}">$82.000</td>
          </tr>
          <tr th:if="${p.hasDeposit}">
            <td style="padding:2px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;color:#222222;">Seña recibida</td>
            <td align="right" style="padding:2px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;color:#222222;" th:text="'$' + ${p.deposit}">$20.000</td>
          </tr>
          <tr th:if="${p.hasDeposit}">
            <td style="padding:2px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;color:#222222;">Saldo a abonar</td>
            <td align="right" style="padding:2px 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;font-weight:600;color:#222222;" th:text="'$' + ${p.balance}">$62.000</td>
          </tr>
          <tr th:if="${!p.hasDeposit and p.status.name() == 'PENDING'}">
            <td colspan="2" style="padding:6px 0 0 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:19px;color:#666666;">
              La seña te la indicamos cuando confirmemos el pedido.
            </td>
          </tr>
          <tr th:if="${!#strings.isEmpty(p.couponCode)}">
            <td colspan="2" style="padding:6px 0 0 0;font-family:Poppins,'Segoe UI',Helvetica,Arial,sans-serif;font-size:13px;line-height:19px;color:#666666;"
                th:text="'Cupón aplicado: ' + ${p.couponCode}">Cupón aplicado: CUMPLE-AB3K</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
