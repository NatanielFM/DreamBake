<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crear cuenta — Dulce Sueños</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/footer.css}">
  <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

  <main class="page-main">
    <section class="login-hero">
      <div class="login-inner">
        <div class="login-card">
          <h1 class="login-title">Crear cuenta</h1>

          <form th:action="@{/register}" th:object="${user}" method="post" class="form" id="register-form">
            
            <label for="name" class="form-label">Nombre completo</label>
            <input id="name" th:field="*{name}" type="text" class="form-input" placeholder="Tu nombre completo" required>
            <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="color: red; font-size: 0.8em;"></div>

            <label for="email" class="form-label">Correo electrónico</label>
            <input id="email" th:field="*{email}" type="email" class="form-input" placeholder="tu@ejemplo.com" required>
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red; font-size: 0.8em;"></div>

            <label for="phone" class="form-label">Celular</label>
            <input id="phone" th:field="*{phone}" type="tel" class="form-input" placeholder="+54 9 11 1234 5678" required>

            <label for="password" class="form-label">Contraseña</label>
            <div class="password-wrap">
              <input id="password" th:field="*{password}" type="password" class="form-input" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>
            <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red; font-size: 0.8em;"></div>

            <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
            <input id="confirmPassword" type="password" class="form-input" placeholder="Repite la contraseña" minlength="6" required>
            <span id="passwordError" style="color: red; font-size: 0.8em; display: none;">Las contraseñas no coinciden</span>

            <div class="spacer" style="height:16px;"></div>

            <button type="submit" id="register-submit" class="btn btn-primary login-submit">
              <span>Crear cuenta</span>
            </button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <script th:src="@{/js/register.js}" defer></script>
</body>
</html>
