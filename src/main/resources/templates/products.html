<!-- products.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Productos — Dulce Sueños</title>
  <meta name="description" content="Listado de productos. Agregá y gestioná productos desde el panel de administración." />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/header.css}">
  <link rel="stylesheet" th:href="@{/css/products.css}">
</head>
<body class="site">

  <!-- Header por script-->
  <div id="header"></div>

  <!-- Main -->
  <main id="main" style="padding-top: var(--header-height);">
    <section class="products-hero" aria-labelledby="products-title">
      <div class="container">
        <h1 id="products-title" class="page-title">Productos</h1>
        <p class="page-lead">Listado de productos. Agregá nuevos productos desde el panel de administración.</p>

        <!-- Controles: búsqueda y filtro (preparados) -->
        <div class="products-controls" role="region" aria-label="Controles de productos">
          <input id="search" class="search-input" type="search" placeholder="Buscar producto..." aria-label="Buscar producto">
          <select id="categoryFilter" class="select-filter" aria-label="Filtrar por categoría">
            <option value="">Todas las categorías</option>
          </select>
        </div>

        <!-- Grid de productos -->
        <div id="productsGrid" class="products-grid" aria-live="polite" aria-busy="false">
          <!-- Productos renderizados por products.js -->
        </div>

        <!-- Estado vacío -->
        <div id="emptyState" class="empty-state visually-hidden" role="status" aria-live="polite">
          <h2>No hay productos aún</h2>
          <p>Parece que todavía no agregaste productos. Podés hacerlo desde el panel de administración.</p>
          <a class="btn btn-primary" href="admin.html">Ir al panel de administración</a>
        </div>

        <!-- Paginación placeholder -->
        <div id="pagination" class="pagination" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <!-- Modal de detalle (accesible) -->
  <div id="productModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modalTitle">
    <div class="modal-backdrop" data-dismiss="modal"></div>
    <div class="modal-panel" role="document">
      <button class="modal-close" aria-label="Cerrar" data-dismiss="modal">✕</button>
      <div class="modal-body">
        <h3 id="modalTitle">Producto</h3>
        <div id="modalContent"></div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>© <span id="year"></span> Dulce Sueños</div>
    </div>
  </footer>

  <script th:src="@{/js/header.js}"></script>
  <script th:src="@{/js/products.js}"></script>
</body>
</html>
