# =====================================================================
# Configuración para PRODUCCIÓN (cuando el sistema se publique en internet)
# =====================================================================
# Este archivo NO se usa en la computadora de desarrollo. Se activa solo al
# arrancar la app con el perfil "prod":
#
#   java -jar dreambake.jar --spring.profiles.active=prod
#
# Lo que pone acá reemplaza a lo de application.properties. Los datos
# secretos (usuario y contraseña de la base, clave de la sesión) NO se
# escriben en este archivo: se leen de variables de entorno del servidor,
# así no quedan guardados en el repositorio.
#
# Variables de entorno que hay que definir en el servidor:
#   DREAMBAKE_DB_URL               ej: jdbc:mysql://localhost:3306/dreambake_db?serverTimezone=UTC
#   DREAMBAKE_DB_USER              un usuario propio de MySQL (no root), con permisos solo sobre dreambake_db
#   DREAMBAKE_DB_PASSWORD          su contraseña
#   DREAMBAKE_REMEMBER_ME_KEY      un texto largo y al azar (firma la cookie de "Mantener la sesión iniciada")

# --- Base de datos ---
spring.datasource.url=${DREAMBAKE_DB_URL}
spring.datasource.username=${DREAMBAKE_DB_USER}
spring.datasource.password=${DREAMBAKE_DB_PASSWORD}

# No mostrar cada consulta SQL en la consola (es lento y llena los registros)
spring.jpa.show-sql=false

# --- Sesión y cookies ---
# Con HTTPS, las cookies solo viajan cifradas (Secure) y JavaScript no puede leer la de sesión (HttpOnly)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=60m

# Clave de la cookie "Mantener la sesión iniciada" (ver SecurityConfig)
dreambake.remember-me-key=${DREAMBAKE_REMEMBER_ME_KEY}

# Proxy que maneja el HTTPS (Tailscale Funnel): lo resuelve config/ProxyConfig, que solo
# confía en los encabezados X-Forwarded-* si la conexión viene de la propia PC.
# "none" evita que Spring los vuelva a procesar confiando en cualquiera (con "framework",
# un visitante podía escribir su propio X-Forwarded-For y saltear los límites por IP).
server.forward-headers-strategy=none

# --- Errores ---
# No mostrarle al visitante detalles técnicos de los errores (rutas, clases, mensajes internos)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- Herramientas de desarrollo apagadas ---
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.thymeleaf.cache=true
