# =====================================================================
# DreamBake — configuración externa (ARCHIVO DE EJEMPLO)
# =====================================================================
# Cómo usarlo:
#   1. Copiá este archivo como  config/application.properties  (sin "ejemplo").
#   2. Completá los valores. Ese archivo NO se sube a Git (está en .gitignore),
#      así que ahí pueden ir claves y contraseñas reales.
#   3. Spring Boot lo lee solo al arrancar si se ejecuta desde la carpeta del
#      proyecto (la que contiene la carpeta "config"), y sus valores pisan a los
#      de src/main/resources/application.properties.
#
# Una clave vacía no rompe nada: la función que la necesita queda desactivada
# y la app avisa en el log al arrancar (ver config/ConfigurationCheck).
#
# Las líneas que empiezan con # están desactivadas. Las de correo, Google y
# Facebook están así a propósito: si se activan con valor vacío, Spring
# intenta usarlas y falla al arrancar. Sacales el # solo cuando tengas el dato.

# ---------------------------------------------------------------------
# Zona horaria (cumpleaños, backups y recordatorios dependen de esto)
# ---------------------------------------------------------------------
# Hora de Argentina para las fechas que la app envía en JSON.
# (La app también la fija para todo el programa en DreambakeApplication.)
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# ---------------------------------------------------------------------
# Base de datos y clave de sesión (perfil "prod")
# ---------------------------------------------------------------------
# En producción (perfil prod, ver application-prod.properties) estos datos se pueden
# definir de DOS maneras, con los mismos nombres:
#   a) como variables de entorno del sistema:
#        DREAMBAKE_DB_URL, DREAMBAKE_DB_USER, DREAMBAKE_DB_PASSWORD, DREAMBAKE_REMEMBER_ME_KEY
#   b) como claves dentro de este archivo (descomentá las dos líneas que correspondan):
#        spring.datasource.url / username / password    → la base MySQL (usuario propio, no root)
#        dreambake.remember-me-key                      → un texto largo y al azar
# En desarrollo no hace falta: se usan los valores de src/main/resources/application.properties.
#spring.datasource.url=jdbc:mysql://localhost:3306/dreambake_db?useSSL=false&serverTimezone=UTC
#spring.datasource.username=dreambake
#spring.datasource.password=
#dreambake.remember-me-key=

# ---------------------------------------------------------------------
# Chequeo de salud (actuator)
# ---------------------------------------------------------------------
# Solo se expone /actuator/health (¿está viva la app y la base?). Ningún otro endpoint de actuator.
management.endpoints.web.exposure.include=health
# Sin detalles: solo responde UP o DOWN (no muestra datos internos a cualquiera).
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------
# Datos del negocio (se leen con AppProperties)
# ---------------------------------------------------------------------
# Dirección pública del sitio, sin "/" al final. La usan los links de los mails
# (recuperar contraseña, cancelar suscripción). Es la que da Tailscale Funnel o tu dominio.
app.public-url=http://localhost:8080
# Nombre del negocio como aparece en mails y recibos.
app.business.name=Dulce Sueños Posadas
# WhatsApp del negocio con código de país y sin signos (ej: 5493764123456).
# El que usa la tienda hoy se cambia en Panel → Ajustes; este es de respaldo para los mails.
app.business.whatsapp=
# Mail del negocio: aparece como remitente y para responder. Suele ser el mismo usuario de spring.mail.
app.business.email=

# ---------------------------------------------------------------------
# Correo saliente (SMTP) — se usará desde el paso 1.1
# ---------------------------------------------------------------------
# Los datos los da tu proveedor de correo. Con Gmail: host smtp.gmail.com, puerto 587,
# usuario = tu dirección y contraseña = una "contraseña de aplicación"
# (myaccount.google.com → Seguridad → Verificación en dos pasos → Contraseñas de aplicaciones).
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
# STARTTLS: cifra la conexión con el servidor de correo (dejalo en true).
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true

# ---------------------------------------------------------------------
# Login con Google — se usará desde el paso 2.2
# ---------------------------------------------------------------------
# Se sacan de console.cloud.google.com → APIs y servicios → Credenciales → ID de cliente OAuth.
# La URI de redireccionamiento autorizada será  <app.public-url>/login/oauth2/code/google
#spring.security.oauth2.client.registration.google.client-id=
#spring.security.oauth2.client.registration.google.client-secret=

# ---------------------------------------------------------------------
# Login con Facebook — se usará desde el paso 2.3
# ---------------------------------------------------------------------
# Se sacan de developers.facebook.com → tu app → Configuración → Básica (ID y clave secreta de la app).
# La URI de redireccionamiento será  <app.public-url>/login/oauth2/code/facebook
#spring.security.oauth2.client.registration.facebook.client-id=
#spring.security.oauth2.client.registration.facebook.client-secret=

# ---------------------------------------------------------------------
# Bakey, el asistente de IA — se usará desde el paso 5.1
# ---------------------------------------------------------------------
# Clave de la API de Gemini: aistudio.google.com → Get API key. Vacía = Bakey desactivado.
bakey.gemini.api-key=
# Modelo de Gemini a usar (ej: gemini-2.5-flash). Está en la lista de modelos de aistudio.google.com.
bakey.gemini.model=gemini-2.5-flash

# ---------------------------------------------------------------------
# Copias de seguridad — se usarán desde el paso 4.1
# ---------------------------------------------------------------------
# Carpeta donde se guardan los backups de la base. Vacía = backups desactivados.
backup.directory=
# Carpeta de la copia externa (otro disco, pendrive o carpeta sincronizada con Drive). Opcional.
backup.offsite-directory=
# Ruta completa de mysqldump.exe. En esta PC:
#   C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe   (usar / en vez de \)
backup.mysqldump-path=
